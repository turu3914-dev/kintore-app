<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>筋トレ記録</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>筋トレ記録</h1>
    <input type="date" id="date">
  </header>

  <nav>
    <button data-tab="workout" class="active">トレーニング</button>
    <button data-tab="meal">食事</button>
    <button data-tab="body">体組成</button>
    <button data-tab="analysis">分析</button>
    <button data-tab="stats">履歴・設定</button>
  </nav>

  <main>
    <!-- トレーニング -->
    <section id="tab-workout">
      <div class="cards" id="volume-cards"></div>
      <form id="workout-form">
        <select id="w-part"></select>
        <input id="w-exercise" list="exercise-list" placeholder="種目名" required>
        <datalist id="exercise-list"></datalist>
        <input id="w-weight" type="number" step="0.5" min="0" placeholder="重量(kg)" required>
        <input id="w-reps" type="number" min="1" placeholder="回数" required>
        <input id="w-sets" type="number" min="1" value="1" placeholder="セット数" required>
        <button type="submit">追加</button>
      </form>
      <p id="rm-preview" class="hint"></p>
      <ul id="workout-list" class="list"></ul>
      <p id="workout-summary" class="summary"></p>
      <button id="save-image" class="secondary">この日の記録を画像で保存</button>
    </section>

    <!-- 食事 -->
    <section id="tab-meal" hidden>
      <form id="meal-form">
        <select id="m-type">
          <option>朝食</option><option>昼食</option><option>夕食</option><option>間食</option><option>プロテイン</option>
        </select>
        <input id="m-name" list="food-list" placeholder="食品名" required>
        <datalist id="food-list"></datalist>
        <input id="m-kcal" type="number" min="0" placeholder="kcal" required>
        <input id="m-p" type="number" step="0.1" min="0" placeholder="P(g)" value="0">
        <input id="m-f" type="number" step="0.1" min="0" placeholder="F(g)" value="0">
        <input id="m-c" type="number" step="0.1" min="0" placeholder="C(g)" value="0">
        <button type="submit">追加</button>
      </form>
      <ul id="meal-list" class="list"></ul>
      <p id="meal-summary" class="summary"></p>
    </section>

    <!-- 体組成 -->
    <section id="tab-body" hidden>
      <div class="row">
        <label>身長(cm) <input id="b-height" type="number" step="0.1" min="0" placeholder="BMI計算用"></label>
      </div>
      <div class="cards" id="body-cards"></div>
      <form id="body-form">
        <input id="b-weight" type="number" step="0.1" min="0" placeholder="体重(kg)" required>
        <input id="b-fat" type="number" step="0.1" min="0" placeholder="体脂肪率(%)">
        <input id="b-muscle" type="number" step="0.1" min="0" placeholder="筋肉量(kg)">
        <button type="submit">記録</button>
      </form>
      <select id="body-metric"></select>
      <canvas id="body-chart" width="640" height="240"></canvas>
      <ul id="body-list" class="list"></ul>
    </section>

    <!-- 分析 -->
    <section id="tab-analysis" hidden>
      <h2>RM換算</h2>
      <form id="rm-form">
        <input id="rm-weight" type="number" step="0.5" min="0" placeholder="重量(kg)">
        <input id="rm-reps" type="number" min="1" max="30" placeholder="回数">
      </form>
      <div id="rm-result"></div>

      <h2>種目別分析</h2>
      <select id="an-exercise"></select>
      <div class="cards" id="an-cards"></div>
      <canvas id="an-chart" width="640" height="240"></canvas>

      <h2>週ごとの負荷量(直近8週)</h2>
      <div id="weekly-bars"></div>

      <h2>部位別の負荷量(選択月)</h2>
      <div id="part-bars"></div>
    </section>

    <!-- 履歴・設定 -->
    <section id="tab-stats" hidden>
      <h2>目標(1日)</h2>
      <form id="goal-form">
        <input id="g-kcal" type="number" min="0" placeholder="kcal">
        <input id="g-p" type="number" min="0" placeholder="P(g)">
        <button type="submit">保存</button>
      </form>
      <div id="goal-progress"></div>
      <h2>最近の記録</h2>
      <div id="history"></div>
      <h2>データ</h2>
      <button id="export" class="secondary">JSONで書き出し</button>
      <label class="file">読み込み<input type="file" id="import" accept="application/json" hidden></label>
      <button id="load-demo" class="secondary">デモデータを読み込む</button>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
